"$schema" = "https://yakbox.dev/schemas/audiobook-manifest-v1.schema.json"
schema_version = 1
sources = ["source/book.md"]

[book]
title = "Two Editions"
author = "Example Author"
language = "en"

[voices.narrator]
display_name = "Narrator"
rights_basis = "not_applicable"

[voices.character]
display_name = "Character"
rights_basis = "not_applicable"

[profiles.narrator]
backend = "fake"
voice = "narrator"
sample_rate = 16000

[profiles.character]
backend = "fake"
voice = "character"
sample_rate = 22050

[targets.narrator-edition]
profile = "narrator"
output_root = "build/narrator-edition"
mastering = true
m4b = false

[targets.character-edition]
profile = "character"
output_root = "build/character-edition"
mastering = true
m4b = false
