[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[project]
name = "yakbox"
version = "0.1.0"
description = "A local-first, reproducible audiobook build system"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yakbox contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.3.1,<9",
    "httpx>=0.28.1,<1",
    "markdown-it-py>=4.0,<5",
    "rich>=15.0,<16",
]

[project.optional-dependencies]
credentials = ["keyring>=25.7,<26"]
local = ["chatterbox-tts"]

[dependency-groups]
test = [
    "hypothesis>=6.148",
    "jsonschema>=4.25",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "pytest-socket>=0.7",
    "respx>=0.22",
]
quality = [
    "ruff>=0.14",
    "ty>=0.0.1a32,<0.1",
]
dev = [
    { include-group = "test" },
    { include-group = "quality" },
    "pre-commit>=4.3",
]

[project.scripts]
yakbox = "yakbox.cli:main"

[tool.uv]
required-version = ">=0.11.26,<0.12"
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "yakbox"
source-include = [
    "docs/**",
    "tests/**",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --disable-socket --allow-unix-socket"
asyncio_mode = "strict"
testpaths = ["tests"]
markers = [
    "live: opt-in tests that may use external provider or model resources",
]

[tool.coverage.run]
branch = true
source = ["yakbox"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "ASYNC",
    "C4",
    "C90",
    "DTZ",
    "G",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "RUF",
    "SIM",
]
ignore = ["PLR0913"]
extend-ignore = ["ASYNC240"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"src/yakbox/audiobook/manifest.py" = ["C901", "PLR0912"]
"src/yakbox/audiobook/sources.py" = ["C901", "PLR0915"]
"src/yakbox/cli.py" = ["PLC0415", "PLR0917"]
"src/yakbox/cloud/batch.py" = ["C901", "PLR0911", "PLR0912", "PLR0915", "PLR0917"]
"src/yakbox/local.py" = ["PLC0415"]
"src/yakbox/speech/services.py" = ["PLC0415"]
"src/yakbox/speech/workers.py" = ["PLC0415"]
"tests/**/*.py" = ["PLR2004"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]
