[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[project]
name = "yakbox"
version = "0.1.0"
description = "A local-first, reproducible audiobook build system"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yakbox contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.3.1,<9",
    "httpx>=0.28.1,<1",
    "markdown-it-py>=4.0,<5",
    "rich>=15.0,<16",
]

[project.optional-dependencies]
credentials = ["keyring>=25.7,<26"]
local = [
    "chatterbox-tts>=0.1.7,<0.2",
    "diffusers>=0.38.0",
    "gradio>=6.16.0",
    "numba>=0.66.0",
    "numpy>=1.24,<2; python_version < '3.13'",
    "numpy>=2,<2.5; python_version >= '3.13'",
    "onnx>=1.22.0",
    "safetensors>=0.8.0",
    "setuptools>=83.0.0",
    "starlette>=1.3.1",
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "transformers>=5.5.0",
]

[dependency-groups]
test = [
    "hypothesis>=6.148",
    "jsonschema>=4.25",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "pytest-socket>=0.7",
    "respx>=0.22",
]
quality = [
    "ruff>=0.14",
    "ty>=0.0.1a32,<0.1",
]
dev = [
    { include-group = "test" },
    { include-group = "quality" },
    "pre-commit>=4.3",
]

[project.scripts]
yakbox = "yakbox.cli:main"
yakbox-release-preflight = "yakbox.release_preflight:main"

[tool.uv]
required-version = ">=0.11.26,<0.12"
default-groups = ["dev"]
override-dependencies = [
    # chatterbox-tts 0.1.7 pins vulnerable releases. Keep these overrides
    # until upstream's published metadata moves to fixed versions.
    "diffusers>=0.38.0",
    "gradio>=6.16.0",
    # Numba 0.66 currently requires NumPy below 2.5.
    "numpy>=1.24,<2; python_version < '3.13'",
    "numpy>=2,<2.5; python_version >= '3.13'",
    "onnx>=1.22.0",
    "safetensors>=0.8.0",
    "setuptools>=83.0.0",
    "starlette>=1.3.1",
    # Chatterbox's current Python 3.14 resolution pairs these releases.
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "transformers>=5.5.0",
]

[tool.uv.build-backend]
module-name = "yakbox"
source-include = [
    "constraints/**",
    "docs/**",
    "examples/**",
    "tests/**",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--allow-hosts",
    "localhost,127.0.0.0/8,::1/128",
    "--allow-unix-socket",
    "-m",
    "not live",
]
asyncio_mode = "strict"
testpaths = ["tests"]
markers = [
    "live: explicit opt-in tests that use a provider or real model",
]

[tool.coverage.run]
branch = true
source = ["yakbox"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "ASYNC",
    "C4",
    "C90",
    "DTZ",
    "G",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "RUF",
    "SIM",
]
ignore = ["PLR0913"]
extend-ignore = ["ASYNC240"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"src/yakbox/audiobook/manifest.py" = ["C901", "PLR0912"]
"src/yakbox/audiobook/sources.py" = ["C901", "PLR0915"]
"src/yakbox/cli.py" = ["PLC0415", "PLR0917"]
"src/yakbox/cloud/batch.py" = ["C901", "PLR0911", "PLR0912", "PLR0915", "PLR0917"]
"src/yakbox/local.py" = ["PLC0415"]
"src/yakbox/speech/services.py" = ["PLC0415"]
"src/yakbox/speech/workers.py" = ["PLC0415"]
"tests/**/*.py" = ["PLR2004"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]
