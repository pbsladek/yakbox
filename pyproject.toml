[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[project]
name = "yakbox"
version = "0.1.0"
description = "A local-first, reproducible audiobook build system"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yakbox contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.3.1,<9",
    "httpx>=0.28.1,<1",
    "markdown-it-py>=4.0,<5",
    "rich>=15.0,<16",
]

[project.optional-dependencies]
credentials = ["keyring>=25.7,<26"]
local = [
    "chatterbox-tts>=0.1.7,<0.2",
    "diffusers>=0.38.0",
    "gradio>=6.16.0",
    "numba>=0.66.0",
    "numpy>=2,<2.5",
    "onnx>=1.22.0",
    "safetensors>=0.8.0",
    "setuptools>=83.0.0",
    "starlette>=1.3.1",
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "transformers>=5.5.0",
]

[dependency-groups]
test = [
    "hypothesis>=6.148",
    "jsonschema>=4.25",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "pytest-socket>=0.7",
    "respx>=0.22",
]
quality = [
    "import-linter>=2.13",
    "mutmut>=3.7.0",
    "ruff>=0.14",
    "ty>=0.0.1a32,<0.1",
]
dev = [
    { include-group = "test" },
    { include-group = "quality" },
    "pre-commit>=4.3",
]

[project.scripts]
yakbox = "yakbox.cli:main"
yakbox-release-preflight = "yakbox.release_preflight:main"

[tool.uv]
required-version = ">=0.12.0,<0.13"
default-groups = ["dev"]
override-dependencies = [
    # chatterbox-tts 0.1.7 pins vulnerable releases. Keep these overrides
    # until upstream's published metadata moves to fixed versions.
    "diffusers>=0.38.0",
    "gradio>=6.16.0",
    # Numba 0.66 currently requires NumPy below 2.5.
    "numpy>=2,<2.5",
    "onnx>=1.22.0",
    "safetensors>=0.8.0",
    "setuptools>=83.0.0",
    "starlette>=1.3.1",
    # Chatterbox's current Python 3.14 resolution pairs these releases.
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "transformers>=5.5.0",
]

[tool.uv.build-backend]
module-name = "yakbox"
source-include = [
    "constraints/**",
    "docs/**",
    "examples/**",
    "tests/**",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--allow-hosts",
    "localhost,127.0.0.0/8,::1/128",
    "--allow-unix-socket",
    "-m",
    "not live and not performance",
]
asyncio_mode = "strict"
testpaths = ["tests"]
markers = [
    "live: explicit opt-in tests that use a provider or real model",
    "performance: scheduled time and peak-memory regression baselines",
]

[tool.coverage.run]
branch = true
source = ["yakbox"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "yakbox"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "cli-is-an-entrypoint"
name = "Production modules do not depend on the CLI"
type = "forbidden"
source_modules = ["yakbox.*"]
forbidden_modules = ["yakbox.cli"]
ignore_imports = ["yakbox.__main__ -> yakbox.cli"]

[[tool.importlinter.contracts]]
id = "speech-is-backend-neutral"
name = "Speech domain contracts do not depend on backend implementations"
type = "forbidden"
source_modules = [
    "yakbox.speech.capabilities",
    "yakbox.speech.guardrails",
    "yakbox.speech.models",
]
forbidden_modules = ["yakbox.cloud", "yakbox.local"]

[[tool.importlinter.contracts]]
id = "audio-is-backend-neutral"
name = "Audio processing does not depend on orchestration or backends"
type = "forbidden"
source_modules = ["yakbox.audio"]
forbidden_modules = [
    "yakbox.audiobook",
    "yakbox.cli",
    "yakbox.cloud",
    "yakbox.diagnostics",
    "yakbox.local",
    "yakbox.speech",
]

[[tool.importlinter.contracts]]
id = "backends-do-not-directly-couple"
name = "Hosted and local backends do not directly depend on each other"
type = "forbidden"
source_modules = ["yakbox.cloud", "yakbox.local"]
forbidden_modules = ["yakbox.cloud", "yakbox.local"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "subpackage-imports-are-acyclic"
name = "Subpackage imports are acyclic"
type = "acyclic_siblings"
ancestors = [
    "yakbox.audio",
    "yakbox.audiobook",
    "yakbox.cloud",
    "yakbox.diagnostics",
    "yakbox.speech",
]
depth = 0

[tool.mutmut]
source_paths = ["src/yakbox"]
only_mutate = [
    "src/yakbox/_files.py",
    "src/yakbox/contracts.py",
    "src/yakbox/audiobook/artifacts.py",
    "src/yakbox/audiobook/journal.py",
    "src/yakbox/speech/guardrails.py",
]
pytest_add_cli_args_test_selection = ["tests/unit", "tests/integration"]
pytest_add_cli_args = ["--quiet", "--tb=no"]
also_copy = [".github", "README.md", "constraints", "docs", "examples"]
mutate_only_covered_lines = true
max_stack_depth = 8
on_dependency_change = "rerun"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "ANN",
    "ARG",
    "I",
    "B",
    "UP",
    "ASYNC",
    "C4",
    "C90",
    "BLE",
    "DTZ",
    "G",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "RUF",
    "RET",
    "S",
    "SIM",
    "T20",
]
extend-ignore = ["ASYNC240"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 20
max-positional-args = 5

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]
