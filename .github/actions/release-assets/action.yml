name: Download and verify release assets
description: Install the release helpers and verify every downloaded artifact.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: latest
        python-version: '3.14'
    - shell: bash
      run: uv sync --frozen --no-dev
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: python-package-distributions
        path: dist/
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: python-package-release-metadata
        path: release-metadata/
    - name: Verify release checksums and source metadata
      shell: bash
      run: uv run --no-sync python -m yakbox.release_publication verify-assets
