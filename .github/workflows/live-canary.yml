name: Live backend canary

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Backend canary to run
        required: true
        default: resemble
        type: choice
        options:
          - resemble
          - chatterbox-local
          - both
      local_device:
        description: Chatterbox device for a configured self-hosted runner
        required: false
        default: auto
        type: string
      local_e2e:
        description: Run full local audiobook narration QA and upload its review bundle
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  resemble:
    if: inputs.backend == 'resemble' || inputs.backend == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: live-resemble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - name: Synthesize one bounded hosted canary
        env:
          YAKBOX_RUN_RESEMBLE_LIVE: "1"
          RESEMBLE_API_KEY: ${{ secrets.RESEMBLE_API_KEY }}
          YAKBOX_CLOUD_VOICE_UUID: ${{ secrets.RESEMBLE_VOICE_UUID }}
        run: >-
          uv run pytest --force-enable-socket -m live
          tests/live/test_resemble_live.py

  chatterbox-local:
    if: inputs.backend == 'chatterbox-local' || inputs.backend == 'both'
    runs-on:
      - self-hosted
      - yakbox-chatterbox
    timeout-minutes: 45
    environment: live-chatterbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --all-groups --extra local
      - name: Synthesize one short local canary
        env:
          YAKBOX_RUN_LOCAL_LIVE: "1"
          YAKBOX_LIVE_LOCAL_DEVICE: ${{ inputs.local_device }}
          YAKBOX_LIVE_LOCAL_TIMEOUT_SECONDS: "600"
        run: >-
          uv run pytest --force-enable-socket -m live
          tests/live/test_local_chatterbox_live.py
      - name: Run local audiobook narration E2E
        if: inputs.local_e2e
        env:
          YAKBOX_RUN_LOCAL_E2E: "1"
          YAKBOX_LIVE_LOCAL_DEVICE: ${{ inputs.local_device }}
          YAKBOX_LOCAL_E2E_OUTPUT: build/local-chatterbox-e2e
          YAKBOX_LOCAL_E2E_TIMEOUT_SECONDS: "1800"
        run: >-
          uv run pytest --force-enable-socket -m live -s
          tests/live/test_local_chatterbox_e2e.py
      - name: Upload narration QA package
        if: always() && inputs.local_e2e
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-chatterbox-narration-qa
          path: build/local-chatterbox-e2e
          if-no-files-found: error
          retention-days: 14
