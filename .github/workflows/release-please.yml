name: Prepare release
run-name: Prepare release · ${{ github.ref_name }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-preparation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
      - name: Find the release pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
          CREATED_PR: ${{ steps.release.outputs.pr }}
        run: uv run --no-sync python -m yakbox.release_workflow find-pr
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.number != ''
        with:
          ref: ${{ steps.pr.outputs.branch }}
          clean: false # Keep the helper environment until the version lock is refreshed.
          persist-credentials: false
      - name: Refresh the release lock and worker
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.pr.outputs.branch }}
        run: uv run --no-sync python -m yakbox.release_workflow refresh-pr
      - name: Start CI for the prepared commit
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ steps.pr.outputs.branch }}
        run: uv run --no-sync python -m yakbox.release_workflow start-ci
