name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run lint-imports --no-cache
      - run: uv lock --check
      - run: uv audit --frozen

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - run: uv sync --frozen --all-groups
      - name: Test
        run: >-
          uv run pytest
          --quiet
          --tb=line
          --maxfail=10
          --cov=yakbox
          --cov-branch
          --cov-fail-under=75
          --cov-report=xml:coverage.xml
          --junitxml=test-results.xml
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-diagnostics-${{ runner.os }}-py${{ matrix.python }}
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: ignore
          retention-days: 7

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.14"
          enable-cache: true
      - run: uv build --no-sources
      - run: uv run --isolated --no-project --with dist/*.whl yakbox --help
      - run: uv run --isolated --no-project --with dist/*.whl yakbox --json doctor
      - name: Install the wheel into an isolated SDK environment
        run: |
          uv venv --python 3.14 .sdk-venv
          uv pip install --python .sdk-venv/bin/python dist/*.whl 'ty>=0.0.1a32,<0.1'
      - name: Smoke-test public SDK imports from the wheel
        run: .sdk-venv/bin/python tests/package_sdk_consumer.py
      - name: Type-check a public SDK consumer against the wheel
        run: >-
          .sdk-venv/bin/ty check
          --project /tmp
          --python .sdk-venv/bin/python
          tests/package_sdk_consumer.py
      - run: uv run --isolated --no-project --with dist/*.tar.gz yakbox --version
