name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_pr:
        description: Pending release PR to mark after a publication retry
        required: false
        type: string
      commit:
        description: Exact prepared source commit (defaults to the selected ref)
        required: false
        type: string
      tag:
        description: Release tag (defaults to v plus the project version)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"
          python-version: "3.14"
          enable-cache: true
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: uv lock --check
      - run: uv sync --frozen --all-groups
      - name: Resolve and validate the release tag
        id: release
        env:
          REQUESTED_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: uv run --no-sync python -m yakbox.release_workflow resolve
      - name: Run release preflight
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: uv run --no-sync python -m yakbox.release_workflow preflight
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: release-metadata/yakbox.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-release-metadata
          path: release-metadata/
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"
          python-version: "3.14"
          enable-cache: true
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: uv sync --frozen --all-groups
      - name: Test
        run: >-
          uv run pytest --quiet --tb=line --maxfail=10
          --cov=yakbox --cov-branch
          --cov-report=xml:coverage.xml --junitxml=test-results.xml
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-diagnostics-${{ runner.os }}
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Install and verify the built wheel
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          uv venv --python 3.14 .release-venv
          uv pip install --python .release-venv/bin/python dist/*.whl
          expected="yakbox, version ${RELEASE_TAG#v} (commit ${RELEASE_COMMIT})"
          actual="$(.release-venv/bin/yakbox --version)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
          .release-venv/bin/python tests/package_sdk_consumer.py
          .release-venv/bin/python tests/package_worker_consumer.py

  github-release:
    name: Publish GitHub release
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/release-assets
      - name: Publish the tested files to GitHub
        run: uv run --no-sync python -m yakbox.release_publication publish-github

  publish-pypi:
    name: Publish to PyPI
    needs: [build, test, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/yakbox
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/release-assets
      - name: Reject conflicting PyPI files before retrying
        run: uv run --no-sync python -m yakbox.release_publication check-pypi
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  finish:
    name: Complete release
    needs: [build, github-release, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
      RELEASE_PR: ${{ inputs.release_pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/release-assets
      - name: Verify both destinations and finish the release
        run: uv run --no-sync python -m yakbox.release_publication finish
