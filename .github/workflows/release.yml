name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (defaults to v plus the project version)
        required: false
        type: string
      publish_to:
        description: Publish destination
        required: true
        default: github
        type: choice
        options:
          - github
          - pypi
          - testpypi

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
          python-version: "3.14"
          enable-cache: true
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: uv sync --frozen --all-groups
      - name: Resolve and validate the release tag
        id: release
        env:
          REQUESTED_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          uv run python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          from yakbox.release_preflight import project_version, validate_release_tag

          tag = os.environ["REQUESTED_TAG"] or f"v{project_version(Path.cwd())}"
          validate_release_tag(tag, project_version(Path.cwd()))
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True, timeout=10).strip()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"tag={tag}\ncommit={commit}\n")
          PY
      - name: Run release preflight
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PUBLISH_TO: ${{ inputs.publish_to || 'github' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$PUBLISH_TO" != "github" ]] || git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            uv run yakbox-release-preflight --tag "$RELEASE_TAG" --require-tag-ref
          else
            uv run yakbox-release-preflight --tag "$RELEASE_TAG"
          fi
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: release-metadata/yakbox.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-release-metadata
          path: release-metadata/
          if-no-files-found: error
          retention-days: 7

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
          python-version: "3.14"
          enable-cache: true
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: uv sync --frozen --all-groups
      - name: Test
        run: >-
          uv run pytest --quiet --tb=line --maxfail=10
          --cov=yakbox --cov-branch
          --cov-report=xml:coverage.xml --junitxml=test-results.xml
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-diagnostics-${{ runner.os }}
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Install and verify the built wheel
        run: |
          uv venv --python 3.14 .release-venv
          uv pip install --python .release-venv/bin/python dist/*.whl
          .release-venv/bin/yakbox --version
          .release-venv/bin/python tests/package_sdk_consumer.py
          .release-venv/bin/python tests/package_worker_consumer.py

  publish-pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to == 'pypi'
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/yakbox
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-release-metadata
          path: release-metadata/
      - name: Verify release checksums
        run: |
          mkdir release-assets
          cp dist/* release-metadata/* release-assets/
          (cd release-assets && sha256sum --check SHA256SUMS)
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to == 'testpypi'
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/yakbox
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-release-metadata
          path: release-metadata/
      - name: Verify release checksums
        run: |
          mkdir release-assets
          cp dist/* release-metadata/* release-assets/
          (cd release-assets && sha256sum --check SHA256SUMS)
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  github-release:
    if: github.event_name == 'push' || inputs.publish_to == 'github'
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-release-metadata
          path: release-metadata/
      - name: Verify release checksums
        run: |
          mkdir release-assets
          cp dist/* release-metadata/* release-assets/
          (cd release-assets && sha256sum --check SHA256SUMS)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: >-
          gh release create "$RELEASE_TAG" dist/* release-metadata/*
          --target "$RELEASE_COMMIT" --generate-notes --title "yakbox $RELEASE_TAG"
