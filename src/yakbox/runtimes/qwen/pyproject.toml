[project]
name = "yakbox-analysis-qwen-runtime"
version = "0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "mlx-audio[stt]==0.4.8",
  "regex>=2026.7.19,<2027",
]

[tool.uv]
# Keep the model loaders on the reviewed Hugging Face Hub API generation.
constraint-dependencies = ["huggingface-hub<2"]
override-dependencies = ["cryptography>=50.0.0", "urllib3>=2.8.0"]

