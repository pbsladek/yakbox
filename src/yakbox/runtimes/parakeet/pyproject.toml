[project]
name = "yakbox-analysis-parakeet-runtime"
version = "0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "parakeet-mlx==0.7.0",
  "regex>=2026.11.9,<2027",
]

[tool.uv]
# Keep the model loaders on the reviewed Hugging Face Hub API generation.
constraint-dependencies = ["huggingface-hub<2"]
override-dependencies = [
  "cryptography>=50.0.0",
  "filelock>=4.2.1",
  "urllib3>=2.8.0",
]

